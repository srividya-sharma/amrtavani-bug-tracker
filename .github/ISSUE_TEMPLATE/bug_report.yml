name: Bug report
description: Report something that isn't working
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Version / environment
      placeholder: e.g. v1.2.0, Chrome 120, Windows 11
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to...
        2. Click...
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Low
        - Medium
        - High
        - Critical
  - type: textarea
    id: extra
    attributes:
      label: Screenshots / logs
